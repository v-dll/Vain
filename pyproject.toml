[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vain"
dynamic = ["version"]  # single source of truth: vain/__init__.py (__version__)
description = "Modular network security and compliance orchestration: Nmap -> policy checks -> threat intel -> reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Khaled Wahdan" }]
keywords = ["nmap", "security", "compliance", "vulnerability-management", "cve", "epss", "siem", "blue-team"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "defusedxml>=0.7.1",
    "requests>=2.31",
    "rich>=13.0",
    "Jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/v-dll/Vain"
Issues = "https://github.com/v-dll/Vain/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vain = "vain.cli:main"

[tool.setuptools.dynamic]
version = { attr = "vain.__version__" }

[tool.setuptools.packages.find]
include = ["vain*"]

[tool.setuptools.package-data]
vain = ["data/*.yaml", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
